<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Exercises</title>
    <style>
      /* first exercise */
      .container {
        background-color: royalblue;
        width: 300px;
        height: 300px;
        border: 4px solid blue;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container div {
        background-color: palevioletred;
        border: 4px solid maroon;
        height: 80px;
        width: 80px;
        padding: 6px;
      }

      /* second exercise */
      .head-container {
        background-color: deeppink;
      }
      .head-container ul {
        list-style: none;
        display: flex;
        justify-content: space-around;
        padding: 10px;
        color: white;
      }
      .self {
        font-size: 20px;
        font-weight: bold;
      }

      /* third exercise */
      .header {
        background-color: white;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-between;
        padding: 8px;
      }

      .profile-img {
        border-radius: 50%;
        background-color: rebeccapurple;
        width: 40px;
        height: 40px;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
      }
      .left,
      .right {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .logo {
        color: rebeccapurple;
        font-size: 28px;
        font-weight: bolder;
        font-style: italic;
      }
      ul {
        list-style: none;
        display: flex;
        gap: 16px;
        color: rebeccapurple;
      }
      button {
        color: white;
        background-color: rebeccapurple;
        border-radius: 5px;
        padding: 7px;
        border: none;
        font-weight: bold;
      }

    </style>
  </head>
  <body>
    <!-- first exercise: center div -->
    <div class="container">
      <div>
        <p>center this div</p>
      </div>
    </div>

    <!-- second exercise: basic header. -->
    <header class="head-container">
      <nav>
        <ul>
          <li>one</li>
          <li>two</li>
          <li>three</li>
          <li class="self">LOGO</li>
          <li>four</li>
          <li>five</li>
          <li>six</li>
        </ul>
      </nav>
    </header>

    <!-- exercise 3: header 2 -->
    <div class="header">
      <div class="left">
        <div class="logo">LOGO</div>
        <ul>
          <li>link-one</li>
          <li>link-two</li>
          <li>link-three</li>
        </ul>
      </div>
      <div class="right">
        <button>1 new notification</button>
        <div class="profile-img"></div>
      </div>
    </div>

    
  </body>
</html>
