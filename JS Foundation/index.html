  <body>
    <h3>CHECK THE CONSOLE</h3>
    <script>
      // variables
      // there are 2 ways to assign a variable: let (which can be re-assigned) & const (can re-assign)
      let firstName = "Toria";
      let lastName = "Kalu";
      console.log(firstName);
      console.log("hello, world!");
      // reassigning variables.author

      let age = 21;
      console.log(age);

      age = 32;
      console.log(age);

      // this will give an error
      //   const pi = 3.14;
      //   pi = 15;

      //   console.log(pi);

      //   Numbers
      //  Order of Operations ( PEMDAS or BODMAS). This means:
      // Parentheses (or Brackets) are evaluated first.
      // Exponentiation is done next, from right to left.
      // Multiplication and Division are done next, from left to right.
      // Addition and Subtraction are done last, from left to right.

      console.log(3 + 2 - 76 * (1 + 1));
      //   exercises
      console.log((4 + 6 + 9) / 77);
      let a = 10;
      console.log(a);
      a = 50;
      console.log(a);
      let b = 7 * a;
      console.log(b);

      const max = 57;
      const actual = max - 13;
      const percentage = actual / max;

      console.log(percentage);

      const price = 2500;
      const slashPrice = price - 1000;
      const loss = price - slashPrice;
      console.log(loss);
    </script>
  </body>
